[package]
name = "rexa-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["mongodb", "mssql"]
# MongoDB via the official driver (pure Rust, rustls).
mongodb = ["dep:mongodb", "dep:bson"]
# SQL Server via tiberius.
mssql = ["dep:tiberius", "dep:tokio-util"]
# Embedded DuckDB (compiles the bundled C++ amalgamation — slow, ~1 GB of
# build artifacts). Without it DuckDB connections go through the `duckdb` CLI
# (`duckdb -json`), when one is installed.
duckdb = ["dep:duckdb"]

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
rusqlite = { workspace = true, features = ["hooks"] }
url.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
async-trait = "0.1"
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
tokio-native-tls = "0.3"
mysql_async = { version = "0.36", default-features = false, features = ["minimal", "native-tls-tls"] }
dirs = "6"
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
percent-encoding = "2"
regex = "1"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "chrono", "rust_decimal"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
mongodb = { version = "3", optional = true }
bson = { version = "2", optional = true }
duckdb = { version = "1", features = ["bundled"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
