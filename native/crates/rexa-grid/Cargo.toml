[package]
name = "rexa-grid"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = { version = "0.9.1", features = ["tree-sitter-sql"] }
rexa-ui = { path = "../rexa-ui" }
rexa-core = { path = "../rexa-core" }
# open_add_column_sheet (the grid's "+" header).
rexa-schema = { path = "../rexa-schema" }
rexa-ai = { path = "../rexa-ai" }
# SettingsModel: live grid settings (SettingsChanged).
rexa-settings = { path = "../rexa-settings" }
rexa-store.workspace = true
rexa-drivers.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
# Realtime table watches (Neon live queries + Supabase postgres_changes).
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "native-tls", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2"
