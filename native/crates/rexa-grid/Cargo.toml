[package]
name = "rexa-grid"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-component = { version = "0.9.1", features = ["tree-sitter-sql"] }
rexa-ui = { path = "../rexa-ui" }
rexa-core = { path = "../rexa-core" }
# open_add_column_sheet (the grid's "+" header).
rexa-schema = { path = "../rexa-schema" }
rexa-ai = { path = "../rexa-ai" }
# SettingsModel: live grid settings (SettingsChanged).
rexa-settings = { path = "../rexa-settings" }
rexa-store.workspace = true
rexa-drivers.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
